# Builds the report a reviewer reads instead of the diff, and posts it on the PR.
#
# The report is derived: module graph and call graph from the source, coverage and
# per-function hit counts from a real test run. Running it also runs the tests, so a
# red job means the change does not pass, not that the report failed to build.
#
# That run is the whole suite since #163, both projects, so this job needs a Chromium and a
# Hebrew font the way the browser job in ci.yml does. The alternative was a coverage number
# measured on the node project alone, which called browser-tested code untested.
name: PR report

on:
  pull_request:
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "package.json"
      - "vitest.config.ts"
      - ".github/workflows/pr-report.yml"

# Read the tree, and write the one comment this exists to post. `pull-requests: write`
# is the only thing here above read, and it is what editing the sticky comment needs.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-report-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # No install script runs on this runner, and this is the runner it matters most
      # on: this job holds `pull-requests: write`, so code executed here could write to
      # this repository. See CLAUDE.md, "Code guardrails".
      - run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      # Chromium carries no fonts of its own, so a bare runner draws Hebrew as boxes and
      # every geometry assertion passes against boxes, because boxes have widths. Same
      # reasoning, and the same two commands, as the browser job in ci.yml.
      - name: Install a Hebrew font, and the libraries Chromium needs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core
          fc-cache -f
          npx playwright install-deps chromium

      # The exact version, not the lockfile's hash: the browser is ~300MB of the same bytes
      # every run, and it only changes when Playwright does.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the browser download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # A no-op when the cache hit. Explicit because `playwright` ships no install script, and
      # because the `--ignore-scripts` above would stop one if a future version brought it back.
      - name: Download Chromium
        run: npm run install:browsers

      # Writes pr-report.md, and appends the same markdown to the job summary.
      - name: Build the report
        run: npm run report

      # The whole report, kept where the comment can point at it (#318). The report covers the
      # tree rather than the diff and is far over GitHub's 65,536-character limit on a comment,
      # so the comment carries what fits and links here for the rest. An artifact upload uses the
      # runner's own token, not GITHUB_TOKEN, so `permissions:` above needs nothing more for it.
      - name: Keep the full report as an artifact
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-report
          path: pr-report.md
          retention-days: 14

      - name: Post it on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.number }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          set -euo pipefail
          marker='<!-- pr-report -->'
          # The marker, then the report cut to fit under the limit if it has to be, with every
          # section it leaves out named and pointed at the artifact (tools/pr-report/fit.ts).
          node tools/pr-report/comment.ts "$marker" "in [the \`pr-report\` artifact]($ARTIFACT_URL)" > comment.md

          # One comment per PR, edited in place, so the thread is not buried in reruns. Matched
          # by author as well as marker, as findComment in tools/pr-review/github.ts does (#307):
          # a person quoting the marker must not be the comment this step tries to edit.
          id=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate \
                 --jq "map(select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))) | .[0].id // empty" | head -n1)

          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md
          else
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -F body=@comment.md
          fi
